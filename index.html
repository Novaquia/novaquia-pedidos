const quantities={};
const catalog=document.getElementById('catalog');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){
 const q=document.getElementById('search').value.toLowerCase().trim();
 catalog.innerHTML='';
 models.filter(m=>!q || m.model.toLowerCase().includes(q) || m.variants.some(v=>v.ref.toLowerCase().includes(q))).forEach(m=>{
   const sec=document.createElement('section'); sec.className='model';
   sec.innerHTML=`<h2>${esc(m.model)}</h2><div class="meta">${esc(m.tipo)} · ${esc(m.material)} · ${esc(m.publico)}</div><div class="variants"></div>`;
   const box=sec.querySelector('.variants');
   m.variants.forEach(v=>{
     const d=document.createElement('div'); d.className='variant';
     const n=quantities[v.ref]||0;
     d.innerHTML=`<img src="${v.img}" alt="${esc(v.ref)}"><div class="ref">${esc(v.ref)}</div><div class="stock">Color ${esc(v.color)} · Stock Excel: ${v.stock}</div>
     <div class="qty"><button data-ref="${esc(v.ref)}" data-d="-1">−</button><span>${n}</span><button data-ref="${esc(v.ref)}" data-d="1">+</button></div>
     ${n>v.stock?`<div class="warn">⚠ Supera el stock disponible</div>`:''}`;
     box.appendChild(d);
   });
   catalog.appendChild(sec);
 });
 document.querySelectorAll('button[data-ref]').forEach(b=>b.onclick=()=>{const r=b.dataset.ref,d=Number(b.dataset.d);quantities[r]=Math.max(0,(quantities[r]||0)+d);render();});
 document.getElementById('total').textContent=Object.values(quantities).reduce((a,b)=>a+b,0)+' unidades';
}
document.getElementById('search').addEventListener('input',render); render();
</script></body></html>
