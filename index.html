<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#19a6b3"><title>NOVAQUIA PEDIDOS</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8f8;color:#202020}header{background:#202020;color:#fff;padding:16px max(12px,calc((100% - 1180px)/2))}header h1{margin:0;font-size:25px}header p{margin:4px 0 0;color:#d8eeee}.wrap{max-width:1180px;margin:auto;padding:10px}.nav{display:flex;gap:7px;overflow:auto;position:sticky;top:0;z-index:20;background:#f6f8f8;padding:8px 0}.nav button,.primary,.secondary{border:0;border-radius:11px;padding:11px 14px;font-weight:800;font-size:14px;white-space:nowrap}.nav button{background:#e9f3f4;color:#202020}.nav button.active,.primary{background:#19a6b3;color:#fff}.secondary{background:#e9f3f4;color:#202020}.toolbar{display:flex;gap:9px;align-items:center;position:sticky;top:57px;z-index:19;background:#f6f8f8;padding:7px 0 10px}.badge{background:#d9f1f3;color:#166c74;padding:9px 12px;border-radius:999px;font-weight:800}.search,input,textarea{width:100%;padding:13px;border:1px solid #cbd9da;border-radius:11px;font:inherit;background:#fff}.search{flex:1}.model,.panel{background:#fff;border-radius:18px;margin:12px 0;padding:15px;box-shadow:0 3px 14px #00000012}.model h2,.panel h2{margin:0 0 4px}.muted,.meta{color:#66788a}.variants{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px;margin-top:12px}.variant{border:1px solid #dce4eb;border-radius:14px;padding:9px}.variant img{width:100%;height:135px;object-fit:contain}.ref{font-weight:850;font-size:14px;margin-top:6px;overflow-wrap:anywhere}.stock{font-size:13px;color:#65788a;margin:4px 0 8px}.qty{display:flex;align-items:center;justify-content:space-between;background:#eef5f5;border-radius:10px;overflow:hidden}.qty button{width:44px;height:40px;border:0;background:#d9f1f3;font-size:21px;font-weight:800;color:#166c74}.qty span{font-weight:850}.warn{color:#b54708;font-weight:800;font-size:12px;margin-top:5px}.hidden{display:none!important}.line{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #e4e9ee}.line img{width:80px;height:58px;object-fit:contain}.delete{border:0;border-radius:9px;padding:10px;background:#f7e6e6;color:#8f2d2d;font-weight:800}.summary{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:14px;font-weight:850}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.bottom{position:sticky;bottom:0;background:#202020;color:#fff;padding:11px max(14px,calc((100% - 1180px)/2));display:flex;justify-content:space-between;align-items:center;z-index:30}.bottom button{background:#19a6b3;color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:850}.login{position:fixed;inset:0;background:#f6f8f8;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{background:#fff;border-radius:22px;padding:24px;width:min(520px,100%);text-align:center}.loginbox h1{margin:0 0 8px}.repgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}.repgrid button{border:0;border-radius:13px;padding:15px;background:#e9f3f4;color:#202020;font-weight:900;font-size:16px}.change{border:0;background:transparent;color:#63d0d9;text-decoration:underline;margin-left:8px}.sent{border:1px solid #dbe4eb;border-radius:13px;padding:12px;margin:9px 0}.status{display:inline-block;background:#fff1c9;color:#785900;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:850}.exportbtn{border:0;border-radius:10px;padding:9px 12px;background:#19a6b3;color:#fff;font-weight:850;margin-top:9px}.brand-logo{display:block;object-fit:contain}.login-logo{width:min(390px,88%);height:auto;margin:0 auto 10px}.header-brand{display:flex;align-items:center;gap:12px}.header-logo{width:150px;height:54px;object-fit:contain;background:#fff;border-radius:9px;padding:5px}.header-copy h1{font-size:19px;margin:0}.repgrid button:hover{background:#d9f1f3}.repgrid button:active{background:#19a6b3;color:#fff}.nav button.active,.primary,.bottom button{box-shadow:0 2px 7px #19a6b344}@media(max-width:600px){.variants{grid-template-columns:repeat(2,minmax(0,1fr))}.variant img{height:105px}.wrap{padding:7px}.fields{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{top:55px}.line{grid-template-columns:65px 1fr}.line img{width:65px}.repgrid{grid-template-columns:1fr 1fr}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><img class="brand-logo login-logo" src="logo-novaquia.png" alt="Novaquia Distribuciones Ópticas"><div style="font-size:21px;font-weight:900;margin:4px 0 3px">PEDIDOS</div><div class="muted">Acceso privado para comerciales</div><form id="authForm" style="display:grid;gap:10px;margin-top:18px;text-align:left"><label>Correo electrónico<input id="authEmail" type="email" required autocomplete="username" placeholder="comercial@novaquia.com"></label><label>Contraseña<input id="authPassword" type="password" required autocomplete="current-password"></label><button class="primary" id="authSubmit" type="submit">ENTRAR</button><div id="authError" role="alert" style="color:#b54708;font-size:13px"></div></form></div></div>
<header><div class="header-brand"><img class="brand-logo header-logo" src="logo-novaquia.png" alt="Novaquia"><div class="header-copy"><h1>PEDIDOS</h1><p>Comercial: <b id="repName">—</b><button class="change" onclick="changeRep()">Cerrar sesión</button></p></div></div></header>
<main class="wrap"><div class="nav"><button id="tabCatalog" class="active" onclick="showView('catalog')">Catálogo</button><button id="tabOrder" onclick="showView('order')">Mi pedido <span id="navCount"></span></button><button id="tabReview" onclick="showView('review')">Revisión</button><button id="tabSent" onclick="showView('sent')">Enviados <span id="sentCount"></span></button></div>
<section id="catalogView"><div class="toolbar"><span id="badge" class="badge"></span><input id="search" class="search" placeholder="Buscar modelo o referencia"></div><div id="catalog"></div></section>
<section id="orderView" class="hidden"><div class="panel"><h2>Mi pedido</h2><div id="orderLines"></div><div class="summary"><span id="orderTotal"></span><button class="primary" onclick="showView('review')">Continuar →</button></div></div></section>
<section id="reviewView" class="hidden"><div class="panel"><h2>Revisión del pedido</h2><div class="fields"><div><b>Cliente *</b><input id="client" placeholder="Nombre del cliente"></div><div><b>Tarifa *</b><input id="rate" placeholder="Tarifa"></div><div class="full"><b>Observaciones</b><textarea id="notes" rows="3"></textarea></div></div><h3>Artículos</h3><div id="reviewLines"></div><div class="summary"><span id="reviewTotal"></span><button class="primary" onclick="sendOrder()">ENVIAR PEDIDO</button></div><div id="result"></div></div></section>
<section id="sentView" class="hidden"><div class="panel"><h2>Pedidos enviados</h2><div class="muted">Guardados en este dispositivo como pendientes de sincronizar.</div><div id="sentList"></div></div></section></main>
<div class="bottom"><div><b id="bottomTotal">0 unidades</b><div style="font-size:12px;color:#d8eeee">Pedido actual guardado</div></div><button onclick="showView('order')">Ver pedido →</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
let all=[],rep='',items=[],cart={},db=null,activeUser=null,photoUrls=[];
const $=id=>document.getElementById(id);const key=()=>`nq_cart_${activeUser?.id||'none'}`;const sentKey=()=>`nq_sent_${activeUser?.id||'none'}`;
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setError(s){$('authError').textContent=s}
async function init(){
 if(!window.NQ_CONFIG||!NQ_CONFIG.url||!NQ_CONFIG.anonKey||NQ_CONFIG.anonKey.includes('PON_AQUI')){setError('Falta configurar la clave pública de Supabase en config.js.');return}
 if(!window.supabase){setError('No se pudo cargar Supabase. Comprueba la conexión a Internet.');return}
 db=window.supabase.createClient(NQ_CONFIG.url,NQ_CONFIG.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});
 $('authForm').addEventListener('submit',async e=>{e.preventDefault();$('authSubmit').disabled=true;setError('');try{const {error}=await db.auth.signInWithPassword({email:$('authEmail').value.trim(),password:$('authPassword').value});if(error)throw error;await loadPrivate()}catch(err){setError('No se pudo iniciar sesión: '+err.message)}finally{$('authSubmit').disabled=false}});
 const {data:{session}}=await db.auth.getSession();if(session)await loadPrivate();
 db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){$('login').classList.remove('hidden');items=[];all=[];rep='';activeUser=null;clearPhotoUrls()}});
}
function clearPhotoUrls(){for(const u of photoUrls)URL.revokeObjectURL(u);photoUrls=[]}
async function loadPrivate(){
 $('login').classList.remove('hidden');setError('Cargando catálogo privado...');
 const {data:{user},error:userError}=await db.auth.getUser();if(userError||!user){setError('Sesión no válida. Inicia sesión de nuevo.');return}
 const {data:profile,error:profileError}=await db.from('comerciales').select('nombre,activo').eq('id',user.id).single();
 if(profileError||!profile||!profile.activo){setError('Comercial no autorizado o desactivado.');return}
 const products=[];for(let offset=0;;offset+=500){
  const {data,error}=await db.from('catalogo_comerciales').select('referencia,producto').eq('comercial_id',user.id).order('referencia').range(offset,offset+499);
  if(error){setError('Error leyendo catálogo: '+error.message);return}
  products.push(...data);if(data.length<500)break;
 }
 clearPhotoUrls();activeUser=user;rep=profile.nombre;all=products.map(x=>({...x.producto,ref:x.referencia,img:'',model:x.producto.model||x.referencia}));items=all;
 cart=JSON.parse(localStorage.getItem(key())||'{}');$('repName').textContent=rep;$('badge').textContent=rep;
 $('login').classList.add('hidden');$('authPassword').value='';setError('');renderCatalog();update();showView('catalog');
 // Descarga autenticada: no se exponen URLs públicas ni tokens en el HTML.
 const jobs=all.map((v)=>async()=>{
  if(!v.imagen_path)return;
  const {data,error}=await db.storage.from(v.imagen_bucket||'catalogo-privado').download(v.imagen_path);
  if(error||!data)return;
  const u=URL.createObjectURL(data);photoUrls.push(u);v.img=u;
 });
 // Descarga en lotes pequeños para no saturar la conexión.
 for(let i=0;i<jobs.length;i+=8){if(activeUser?.id!==user.id)break;await Promise.all(jobs.slice(i,i+8).map(f=>f()));if(activeUser?.id===user.id)renderCatalog()}
}
async function changeRep(){if(!db)return;await db.auth.signOut();localStorage.removeItem('nq_rep');$('login').classList.remove('hidden');setError('')}
function groups(){let m={};for(const x of items)(m[x.model]??=[]).push(x);return Object.entries(m)}
function renderCatalog(){let q=$('search').value.trim().toLowerCase();let gs=groups().filter(([m,vs])=>!q||m.toLowerCase().includes(q)||vs.some(v=>v.ref.toLowerCase().includes(q)));$('catalog').innerHTML=gs.map(([m,vs])=>`<div class="model"><h2>${safe(m)}</h2><div class="meta">${[vs[0].tipo,vs[0].material,vs[0].publico].filter(Boolean).map(safe).join(' · ')}</div><div class="variants">${vs.map(v=>`<div class="variant"><img loading="lazy" src="${v.img||''}" alt="Fotografía de ${safe(v.ref)}"><div class="ref">${safe(v.ref)}</div><div class="stock">${Number(v.stock)===0?'Sin existencias':'Stock: '+(v.stock??'—')}</div><div class="qty"><button onclick="qty('${esc(v.ref)}',-1)">−</button><span>${cart[v.ref]||0}</span><button onclick="qty('${esc(v.ref)}',1)">+</button></div>${(cart[v.ref]||0)>(v.stock||0)?'<div class="warn">⚠ Supera el stock disponible</div>':''}</div>`).join('')}</div></div>`).join('')||'<div class="panel">No se encontraron modelos.</div>'}
function esc(s){return s.replaceAll('\\','\\\\').replaceAll("'","\\'")}
function qty(ref,d){cart[ref]=Math.max(0,(cart[ref]||0)+d);if(!cart[ref])delete cart[ref];localStorage.setItem(key(),JSON.stringify(cart));renderCatalog();update()}
function chosen(){return items.filter(x=>cart[x.ref]).map(x=>({...x,qty:cart[x.ref]}))}
function line(v,del=false){return `<div class="line"><img src="${v.img||''}"><div><b>${safe(v.ref)}</b><div class="muted">${safe(v.model)} · ${safe(v.color)} · ${v.qty} ud.</div></div>${del?`<button class="delete" onclick="qty('${esc(v.ref)}',-${v.qty})">Quitar</button>`:''}</div>`}
function update(){let c=chosen(),n=c.reduce((a,x)=>a+x.qty,0);$('navCount').textContent=n?`(${n})`:'';$('bottomTotal').textContent=`${n} unidades`;$('orderLines').innerHTML=c.length?c.map(v=>line(v,true)).join(''):'<div class="muted">Todavía no has añadido artículos.</div>';$('reviewLines').innerHTML=c.map(v=>line(v)).join('');$('orderTotal').textContent=`${n} unidades`;$('reviewTotal').textContent=`${n} unidades`;let sent=JSON.parse(localStorage.getItem(sentKey())||'[]');$('sentCount').textContent=sent.length?`(${sent.length})`:'';$('sentList').innerHTML=sent.length?sent.map(o=>`<div class="sent"><b>${safe(o.id)}</b> · ${safe(o.client)}<br><span class="status">PENDIENTE DE SINCRONIZAR</span><div class="muted">${o.units} unidades · ${safe(o.date)}</div><button class="exportbtn" onclick="exportOdoo('${o.id}')">EXPORTAR PARA ODOO</button></div>`).join(''):'<div class="muted" style="margin-top:12px">No hay pedidos enviados.</div>'}
function showView(v){['catalog','order','review','sent'].forEach(x=>{$(x+'View').classList.toggle('hidden',x!==v);$('tab'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active',x===v)});if(v==='review')update();if(v==='sent')update()}
function sendOrder(){let c=chosen();if(!c.length)return alert('El pedido está vacío.');let client=$('client').value.trim(),rate=$('rate').value.trim();if(!client||!rate)return alert('Indica cliente y tarifa.');let now=new Date(),id='NQ-'+now.toISOString().replace(/\D/g,'').slice(0,14),sent=JSON.parse(localStorage.getItem(sentKey())||'[]');sent.unshift({id,client,rate,notes:$('notes').value,units:c.reduce((a,x)=>a+x.qty,0),lines:c,date:now.toLocaleString('es-ES')});localStorage.setItem(sentKey(),JSON.stringify(sent));cart={};localStorage.setItem(key(),'{}');$('client').value='';$('rate').value='';$('notes').value='';$('result').innerHTML=`<div style="background:#e8f6ed;border:1px solid #9bd3aa;border-radius:12px;padding:14px;margin-top:12px"><b>✓ Pedido ${id} preparado</b><br>Pendiente de sincronizar.</div>`;renderCatalog();update()}

function exportOdoo(id){
 let sent=JSON.parse(localStorage.getItem(sentKey())||'[]'),o=sent.find(x=>x.id===id);if(!o)return alert('No se encuentra el pedido.');
 let payload={format:'NOVAQUIA_ODOO_ORDER_V1',order_id:o.id,commercial:rep,customer:o.client,pricelist:o.rate,notes:o.notes||'',date:o.date,total_units:o.units,lines:o.lines.map(x=>({reference:x.ref,model:x.model,color:x.color,quantity:x.qty}))};
 let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${o.id}_ODOO.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

$('search').addEventListener('input',()=>{if(activeUser)renderCatalog()});init();
</script></body></html>
